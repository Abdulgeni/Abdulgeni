<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Abdulgeni Abdulaziz</title>
  <desc id="d">Full Stack AI Engineer. RAG, agents, automation, security-minded.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B18">
        <animate attributeName="stop-color" values="#070B18;#140E3A;#08233F;#070B18" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#1B3C6E">
        <animate attributeName="stop-color" values="#1B3C6E;#3B2FB8;#0E6B66;#1B3C6E" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#B8860B">
        <animate attributeName="stop-color" values="#B8860B;#E8693A;#C9A24B;#B8860B" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="650" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#8A6A1F"/>
      <stop offset="0.5" stop-color="#FFF1BF"/>
      <stop offset="1" stop-color="#C9A24B"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;400 0;0 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lines" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#lines)"/>
  <rect width="1200" height="340" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
  </rect>

  <rect x="0" y="0" width="1200" height="3" fill="url(#gold)"/>
  <rect x="0" y="337" width="1200" height="3" fill="url(#gold)"/>

  <g fill="none" stroke="#E8C872" stroke-width="2" stroke-opacity="0.85">
    <path d="M28 64 V28 H64"/>
    <path d="M1136 28 H1172 V64"/>
    <path d="M28 276 V312 H64"/>
    <path d="M1136 312 H1172 V276"/>
  </g>

  <g fill="#F6D98A">
    <circle cx="90" cy="340" r="2"><animate attributeName="cy" values="345;-10" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="340" r="1.5"><animate attributeName="cy" values="345;-10" dur="11s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="340" r="2.5"><animate attributeName="cy" values="345;-10" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="340" r="1.5"><animate attributeName="cy" values="345;-10" dur="12s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="12s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="340" r="2"><animate attributeName="cy" values="345;-10" dur="10s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="340" r="2.5"><animate attributeName="cy" values="345;-10" dur="9s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="9s" begin="5s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="340" r="1.5"><animate attributeName="cy" values="345;-10" dur="13s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="13s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="340" r="2"><animate attributeName="cy" values="345;-10" dur="10s" begin="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" begin="6s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="340" r="2.5"><animate attributeName="cy" values="345;-10" dur="8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="8s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="340" r="1.5"><animate attributeName="cy" values="345;-10" dur="11s" begin="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="11s" begin="7s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="128" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" letter-spacing="8" fill="url(#gold)">ABDULGENI ABDULAZIZ</text>

  <line x1="420" y1="153" x2="582" y2="153" stroke="url(#gold)" stroke-width="1.5"/>
  <line x1="618" y1="153" x2="780" y2="153" stroke="url(#gold)" stroke-width="1.5"/>
  <path d="M600 145 L608 153 L600 161 L592 153 Z" fill="#F6E7B4">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </path>

  <text x="600" y="194" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#E9E4FF">FULL STACK AI ENGINEER  ·  RAG &amp; AGENTS  ·  AUTOMATION  ·  SECURITY-MINDED</text>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#F5EBD0" text-anchor="middle">
    <text x="600" y="256" opacity="0">I build AI systems that survive contact with production.
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.24;0.32;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
    <text x="600" y="256" opacity="0">Tested. Hardened. Documented. Shipped.
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.24;0.32;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
    <text x="600" y="256" opacity="0">RAG  ·  LLM agents  ·  MCP servers  ·  full-stack SaaS
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.24;0.32;1" dur="12s" begin="6s" repeatCount="indefinite"/></text>
    <text x="600" y="256" opacity="0">Fluent in English, Arabic &amp; Turkish. Open to remote work.
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.24;0.32;1" dur="12s" begin="9s" repeatCount="indefinite"/></text>
  </g>
