    <linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#F6D98A"/></linearGradient>
  </defs>
  <rect width="600" height="250" rx="18" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="597" height="247" rx="17" fill="none" stroke="#F472B6" stroke-opacity="0.22" stroke-width="1.5"/>
