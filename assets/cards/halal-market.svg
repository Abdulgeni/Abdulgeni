<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="Halal Market">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A0E08"/><stop offset="1" stop-color="#33180B"/></linearGradient>
    <linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#FDE68A"/></linearGradient>
  </defs>
  <rect width="600" height="250" rx="18" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="597" height="247" rx="17" fill="none" stroke="#FB923C" stroke-opacity="0.22" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="597" height="247" rx="17" fill="none" stroke="url(#ac)" stroke-width="3.5" pathLength="100" stroke-dasharray="14 86" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="6s" begin="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="560" cy="42" r="5" fill="#FB923C"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <rect x="28" y="28" width="228" height="26" rx="13" fill="#FB923C" fill-opacity="0.14"/>
  <text x="44" y="46" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#FB923C">MOBILE · REACT NATIVE</text>
  <text x="28" y="108" font-family="Georgia,'Times New Roman',serif" font-size="38" font-weight="700" fill="url(#ac)">Halal Market</text>
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#F2DCCB">
    <text x="28" y="140">Seller app: offline mutation queue, contract-first monorepo,</text>
    <text x="28" y="164">idempotent 6-state payment and order machine</text>
  </g>
  <rect x="28" y="184" width="544" height="1" fill="#FB923C" fill-opacity="0.25"/>
  <text x="28" y="214" font-family="'Courier New',monospace" font-size="13" fill="#FB923C">React Native · Expo · Zod · 99 tests</text>
</svg>
