<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="Bastion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#051510"/><stop offset="1" stop-color="#0B2B22"/></linearGradient>
    <linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#FDE68A"/></linearGradient>
  </defs>
  <rect width="600" height="250" rx="18" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="597" height="247" rx="17" fill="none" stroke="#34D399" stroke-opacity="0.22" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="597" height="247" rx="17" fill="none" stroke="url(#ac)" stroke-width="3.5" pathLength="100" stroke-dasharray="14 86" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="6s" begin="2s" repeatCount="indefinite"/>
