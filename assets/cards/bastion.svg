  <text x="44" y="46" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#34D399">SECURITY ENGINEERING</text>
  <text x="28" y="108" font-family="Georgia,'Times New Roman',serif" font-size="40" font-weight="700" fill="url(#ac)">Bastion</text>
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#C8EBDD">
